name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/geeta_discussion_test
      JWT_SECRET: ci-only-not-a-production-secret-change-before-deployment-1234
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
          package-manager-cache: false

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend JavaScript syntax
        shell: bash
        run: |
          find backend/src backend/tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 |
            xargs -0 -n1 node --check

      - name: Run isolated custom-policy checks
        working-directory: backend
        run: npm run test:policy

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        run: npm run build
